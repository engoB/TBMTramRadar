name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # chaque nuit : tracés et couleurs GTFS rafraîchis (nouveau build seulement si quelque chose a changé)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest version.json .nojekyll assets data _site/

      - name: Tracés et couleurs officiels (GTFS TBM)
        continue-on-error: true
        run: python tools/build_network.py --out _site/data/network.json

      - name: Versionner le build
        run: python tools/stamp_version.py --site _site --run "${{ github.run_number }}" --sha "${GITHUB_SHA::7}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
