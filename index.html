<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Savoir en temps réel si vous aurez votre tram TBM à Bordeaux, selon votre allure de marche.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tram Radar">
<meta name="app-build" content="__BUILD__">
<title>TBM Tram Radar Bordeaux</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/app.css?v=__BUILD__">
</head>
<body>

<div id="map" role="application" aria-label="Carte du tramway de Bordeaux"></div>

<header id="topbar">
  <span class="brandpill" data-logo title="TBM Tram Radar Bordeaux"></span>
  <button id="live" class="live" type="button" data-state="loading"><span class="dot"></span><span class="txt">TBM…</span></button>
  <button id="gps" type="button" class="gps" data-state="search"><span class="dot"></span><span class="txt">GPS…</span></button>
  <button id="recenter" type="button" class="fab" aria-label="Me recentrer avec ma station" title="Me recentrer" data-icon="locate"></button>
</header>
<div id="banner" class="banner hidden" role="status"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="updateBar" class="updatebar hidden" role="status">
  <span id="updateTxt">Nouvelle version prête</span>
  <button type="button" data-act="update">Mettre à jour</button>
</div>

<main id="card" aria-label="Votre tram">
  <div id="cStation"></div>
  <div id="cDirs" class="dirs scroller" role="radiogroup" aria-label="Direction"></div>
  <div id="cVerdict" aria-live="polite"></div>
  <div id="cadence" class="seg seg-sm" role="radiogroup" aria-label="Votre allure"></div>
</main>

<dialog id="details" class="dd" aria-label="Détails">
  <div class="dd-head"><b>Détails</b><button type="button" class="icon-btn" data-act="details-close" aria-label="Fermer" data-icon="x"></button></div>
  <div id="ddBody" class="dd-body"></div>
</dialog>

<dialog id="cfg" class="cfg" aria-labelledby="cfgTitle">
  <div class="cfg-in">
    <button type="button" class="icon-btn x" data-act="cfg-close" aria-label="Fermer" data-icon="x"></button>
    <h2 id="cfgTitle">Réglages de connexion</h2>
    <p id="cfgDiag"></p>
    <p>Si votre navigateur bloque l'accès direct à l'API TBM (règle CORS), passez par un relais. Collez son adresse avec <b>{url}</b> à l'endroit où l'adresse TBM doit être insérée.</p>
    <label for="proxyInput">Relais CORS (facultatif)</label>
    <input id="proxyInput" type="url" placeholder="https://tbm-relais.monnom.workers.dev/?url={url}" autocomplete="off" spellcheck="false">
    <div class="acts">
      <button type="button" class="btn" data-act="cfg-save">Enregistrer et tester</button>
      <button type="button" class="btn ghost" data-act="cfg-clear">Accès direct</button>
    </div>
    <div id="cfgStatus" class="status" role="status"></div>
    <label>Relais Cloudflare Worker prêt à déployer (fichier worker/cors-proxy.js du dépôt)</label>
    <pre id="workerCode"></pre>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="assets/config.js?v=__BUILD__"></script>
<script src="assets/app.js?v=__BUILD__"></script>
</body>
</html>
